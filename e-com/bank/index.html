<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBank - Online Banking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
        }

        header {
            background-color: #003366;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .login-section,
        .dashboard {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .login-section h2,
        .dashboard h2 {
            margin-bottom: 20px;
            color: #003366;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #003366;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #004c99;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            flex: 1;
            min-width: 250px;
            background: #eef4ff;
            padding: 20px;
            border-radius: 10px;
        }

        .card h3 {
            color: #003366;
            margin-bottom: 10px;
        }

        .actions {
            margin-top: 20px;
        }

        .actions button {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #003366;
            color: white;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">MyBank</div>
    <nav>
        #Home</a>
        #Accounts</a>
        #Transfers</a>
        #Support</a>
    </nav>
</header>

<div class="container">

    <!-- Login Section -->
    <div class="login-section">
        <h2>Customer Login</h2>
        <form>
            <input type="text" placeholder="Customer ID" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>

    <!-- Dashboard Section -->
    <div class="dashboard">
        <h2>Account Overview</h2>

        <div class="cards">
            <div class="card">
                <h3>Savings Account</h3>
                <p>Account No: XXXXX1234</p>
                <h2>$15,250.00</h2>
            </div>

            <div class="card">
                <h3>Current Account</h3>
                <p>Account No: XXXXX5678</p>
                <h2>$8,450.00</h2>
            </div>

            <div class="card">
                <h3>Credit Card</h3>
                <p>Available Limit</p>
                <h2>$12,000.00</h2>
            </div>
        </div>

        <div class="actions">
            <h3>Quick Actions</h3>
            <button>Transfer Money</button>
            <button>Pay Bills</button>
            <button>View Statements</button>
            <button>Manage Beneficiaries</button>
        </div>
    </div>

</div>

<footer>
    © 2026 MyBank. All Rights Reserved.
</footer>

</body>
</html>
